[package]
name = "lumin"
version = "0.1.0"
description = "Lumin - AI-powered learning companion"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-dns-sd = "0.1"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
local-ip-address = "0.6"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

ort = { version = "2.0.0-rc.13", features = ["half"] }
# esaxx_fast dropped: esaxx-rs build.rs hardcodes /MT (static CRT), which
# conflicts with ort's prebuilt /MD onnxruntime.lib on MSVC (LNK2038/LNK2005).
tokenizers = { version = "0.23", default-features = false, features = ["progressbar", "onig"] }
ndarray = "0.17"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
half = "2.3"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }

[features]
# Cargo のフィーチャはターゲット別に切り替えられない。ORT の読み込み方は
# プラットフォームごとに違う（デスクトップ/Android は実行時読み込み、iOS は静的リンク）ため、
# フィーチャではなく下の [target.*.dependencies] で決めている。default を空にしてあるのは、
# tauri CLI が `--no-default-features --features <default>` の形でそのまま転送するので、
# ここに load-dynamic を置くと iOS ビルドでも ort/load-dynamic が有効になってしまうから。
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt", "ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
nnapi = ["ort/nnapi"]
xnnpack = ["ort/xnnpack"]
# デスクトップ/Android では下のターゲット指定で常に有効。明示指定用に残してある。
load-dynamic = ["ort/load-dynamic"]

# iOS 以外は同梱した ONNX Runtime を実行時に読み込む（runtime/ 以下、prepare:runtime が配置）。
[target.'cfg(not(target_os = "ios"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["load-dynamic"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["half", "coreml"] }

# iOS は dylib を読み込めないので、ビルド済みの静的 ONNX Runtime をリンクする。
# ort-sys の Apple 向けビルドには CoreML EP が入っており、apple-ios では
# CoreML.framework も自動でリンクされる。
[target.'cfg(all(target_os = "ios", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["half", "coreml", "download-binaries"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
