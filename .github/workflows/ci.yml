name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (bun build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Disable git CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (tsc + vite)
        run: bun run build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Root Cargo.toml is a virtual workspace, so cargo defaults to <root>/target.
      # Absolute path so Tauri CLI's internal cwd (src-tauri) can't re-resolve it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - name: Disable git CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # `runtime/` is a Tauri bundle resource. Generate the platform-specific
      # ONNX Runtime libraries before Cargo runs Tauri's build script.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage ONNX runtime
        run: python3 scripts/prepare_onnx_runtime.py
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # The Windows bin target has no tests and links Tauri's resource.lib,
      # which already contains an app manifest. Test the lib target separately
      # to avoid adding a second manifest to that empty bin test harness.
      - name: cargo test (lib)
        if: runner.os == 'Windows'
        env:
          LUMIN_TEST_MANIFEST: "true"
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: cargo test (non-Windows)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  tauri:
    name: tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Absolute path: Tauri CLI runs cargo from src-tauri/, which re-resolves
      # a relative CARGO_TARGET_DIR into src-tauri/src-tauri/target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-latest
            bundles: app,dmg
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            bundles: msi,nsis
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - name: Disable git CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Tauri app bundle
        run: bun run tauri build --bundles ${{ matrix.bundles }}
      - name: Upload Tauri app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7
